<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Bank - Исламский банк AI Консультант</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2D9A86',
                        secondary: '#EEFE6D',
                        accent: '#FFFFFF',
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 120px);
        }

        .message-bubble {
            max-width: 80%;
            word-wrap: break-word;
        }

        .typing-indicator {
            display: none;
        }

        .typing-indicator.show {
            display: block;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div
                        class="w-10 h-10 bg-gradient-to-r from-primary to-secondary rounded-full flex items-center justify-center">
                        <i class="fas fa-robot text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">Zaman Bank</h1>
                        <p class="text-sm text-gray-500">Исламский банк - AI Консультант</p>
                    </div>
                </div>
                <button id="clearChat"
                    class="p-2 text-gray-500 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                    title="Clear conversation">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        <div id="chatContainer"
            class="chat-container bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
            <div id="messages" class="h-full overflow-y-auto p-4 space-y-4">
                <!-- Welcome Message -->
                <div class="message-bubble fade-in">
                    <div class="flex items-start space-x-3">
                        <div
                            class="w-8 h-8 bg-gradient-to-r from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-robot text-white text-sm"></i>
                        </div>
                        <div class="bg-gray-100 rounded-lg p-3 message-bubble">
                            <p class="text-gray-800">Ассаламу алейкум! Я ваш финансовый консультант банка Zaman Bank.
                                Как я могу помочь вам с банковскими услугами?</p>
                            <span class="text-xs text-gray-500 mt-1 block">Только что</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator"
            class="typing-indicator bg-white rounded-lg shadow-sm border border-gray-200 p-4 mt-4">
            <div class="flex items-center space-x-3">
                <div
                    class="w-8 h-8 bg-gradient-to-r from-primary to-secondary rounded-full flex items-center justify-center">
                    <i class="fas fa-robot text-white text-sm"></i>
                </div>
                <div class="bg-gray-100 rounded-lg p-3">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s">
                        </div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mt-4">
            <div class="flex space-x-3">
                <input type="text" id="messageInput" placeholder="Type your message here..."
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    autocomplete="off">
                <button id="sendButton"
                    class="px-6 py-3 bg-gradient-to-r from-primary to-secondary text-white rounded-lg hover:from-secondary hover:to-primary transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        class ChatBot {
            constructor() {
                this.messages = [];
                this.isTyping = false;
                this.initializeElements();
                this.attachEventListeners();
            }

            initializeElements() {
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.messagesContainer = document.getElementById('messages');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.clearButton = document.getElementById('clearChat');
            }

            attachEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                this.clearButton.addEventListener('click', () => this.clearChat());
            }

            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || this.isTyping) return;

                // Add user message
                this.addMessage(message, 'user');
                this.messageInput.value = '';
                this.setTyping(true);

                try {
                    // Simulate AI response - replace with actual API call
                    const response = await this.getAIResponse(message);
                    this.addMessage(response, 'ai');
                } catch (error) {
                    this.addMessage('Sorry, I encountered an error. Please try again.', 'ai');
                } finally {
                    this.setTyping(false);
                }
            }

            addMessage(text, sender) {
                const messageId = Date.now();
                const timeString = new Date().toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const messageElement = document.createElement('div');
                messageElement.className = 'message-bubble fade-in';
                messageElement.innerHTML = `
                    <div class="flex items-start space-x-3 ${sender === 'user' ? 'flex-row-reverse space-x-reverse' : ''}">
                        <div class="w-8 h-8 ${sender === 'user' ? 'bg-gray-500' : 'bg-gradient-to-r from-primary to-secondary'} rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fas ${sender === 'user' ? 'fa-user' : 'fa-robot'} text-white text-sm"></i>
                        </div>
                        <div class="bg-${sender === 'user' ? 'primary' : 'gray-100'} text-${sender === 'user' ? 'white' : 'gray-800'} rounded-lg p-3 message-bubble">
                            <p>${this.escapeHtml(text)}</p>
                            <span class="text-xs ${sender === 'user' ? 'text-blue-100' : 'text-gray-500'} mt-1 block">${timeString}</span>
                        </div>
                    </div>
                `;

                this.messagesContainer.appendChild(messageElement);
                this.scrollToBottom();
            }

            setTyping(typing) {
                this.isTyping = typing;
                this.sendButton.disabled = typing;
                this.messageInput.disabled = typing;

                if (typing) {
                    this.typingIndicator.classList.add('show');
                } else {
                    this.typingIndicator.classList.remove('show');
                }
            }

            async getAIResponse(message) {
                try {
                    // Call the real AI API endpoint
                    const response = await fetch(`/chat?message=${encodeURIComponent(message)}`);
                    const data = await response.json();
                    return data.response;
                } catch (error) {
                    console.error('Error calling AI API:', error);
                    return 'Извините, произошла ошибка при получении ответа. Пожалуйста, попробуйте еще раз.';
                }
            }

            clearChat() {
                this.messagesContainer.innerHTML = `
                    <div class="message-bubble fade-in">
                        <div class="flex items-start space-x-3">
                            <div class="w-8 h-8 bg-gradient-to-r from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-robot text-white text-sm"></i>
                            </div>
                            <div class="bg-gray-100 rounded-lg p-3 message-bubble">
                                <p class="text-gray-800">Ассаламу алейкум! Я ваш финансовый консультант банка Zaman Bank. Как я могу помочь вам с банковскими услугами?</p>
                                <span class="text-xs text-gray-500 mt-1 block">Только что</span>
                            </div>
                        </div>
                    </div>
                `;
                this.messages = [];
            }

            scrollToBottom() {
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize chatbot when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ChatBot();
        });
    </script>
</body>

</html>
